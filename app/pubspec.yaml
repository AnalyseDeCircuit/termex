name: termex
description: AI-native SSH client — Always-on cloud AI workspace powered by SSH
version: 0.79.0+1

# This is an application, never a pub.dev package. Without this, the analyzer
# treats it as publishable and reports the termex_bridge / termex_shared path
# dependencies as `invalid_dependency` warnings, which fail `flutter analyze`
# in CI.
publish_to: none

environment:
  # 3.22 predates Color.withValues() and Color.toARGB32(), both of which the
  # app uses; declaring the real floor keeps a too-old SDK from failing deep
  # in analysis with undefined-member errors instead of here.
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  termex_bridge:
    path: ../crates/termex-flutter-bridge
  # 与移动端共用的 Dart 包（widgets / design / terminal / features 的大部分）
  termex_shared:
    path: ../packages/termex_shared
  flutter_svg: ^2.0.0
  timeago: ^3.6.0
  uuid: ^4.4.0
  desktop_drop: ^0.4.0
  file_picker: ^8.0.0
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  url_launcher: ^6.3.0
  tray_manager: ^0.2.3
  freezed_annotation: ^2.4.0
  meta: ^1.12.0
  flutter_rust_bridge: 2.12.0
  xterm: ^4.0.0
  share_plus: ^10.0.0
  shared_preferences: ^2.2.0
  flutter_localizations:
    sdk: flutter
  # Maintained fork of lucide_icons that works with Flutter 3.44+
  # (the old package extends IconData which is now a final class).
  lucide_icons_flutter: ^3.1.14
  # 监控指标折线图（monitor/widgets/metric_chart.dart）
  fl_chart: ^0.69.0
  # 电池监控（system/battery/battery_monitor.dart）— 桌面端笔记本/平板也有电池
  battery_plus: ^6.0.0
  # 网络质量检测（system/network/network_quality_detector.dart）
  connectivity_plus: ^6.0.0
  # path_provider explicit — Android/iOS sandboxes don't expose XDG-style
  # data dirs to the `dirs` Rust crate. Dart resolves the writable app dir
  # and seeds it into the bridge via `app::init_app` before any other call.
  path_provider: ^2.1.0
  # Local notifications — v0.79.21 mobile primitive for AI task completion
  # alerts. Remote push (FCM) deferred to v0.79.23+.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.7.0
  integration_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  # Cross-platform launcher-icon generator. Run after editing the
  # source PNG (see `flutter_launcher_icons:` block below) with:
  #   dart run flutter_launcher_icons
  # Regenerates Android mipmap-* / iOS AppIcon.appiconset /
  # macOS AppIcon.appiconset / Windows .ico / Linux PNG in one go
  # so the human only has to manage a single 1024×1024 source.
  flutter_launcher_icons: ^0.14.1

# Source: packages/termex_shared/assets/logo/logo.png (512×512).
# Replace + bump to regenerate everything per platform.
flutter_launcher_icons:
  image_path: "../packages/termex_shared/assets/logo/logo.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "../packages/termex_shared/assets/logo/logo.png"
  windows:
    generate: true
    image_path: "../packages/termex_shared/assets/logo/logo.png"
    icon_size: 256
  web:
    generate: false

flutter:
  uses-material-design: true
  # generate: true was removed — localizations live in termex_shared, where
  # the l10n.yaml + .arb files have moved. Pre-generated .dart files are
  # checked in there too, so the desktop app does NOT need to invoke
  # flutter gen-l10n at pub get time.
  # Note: the brand logo `packages/termex_shared/assets/logo/logo.png`
  # is auto-bundled because termex_shared (a path-dep) declares it in
  # its own pubspec `flutter.assets`. App code references it as
  # `AssetImage('packages/termex_shared/assets/logo/logo.png')` directly
  # — no duplicate declaration needed here.
  fonts:
    - family: JetBrainsMono
      fonts:
        # Font files must be placed at app/fonts/ before building
        - asset: fonts/JetBrainsMono-Regular.ttf
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
