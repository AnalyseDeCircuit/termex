[workspace]
resolver = "2"
# v0.78.0 PC cutover: `src-tauri` removed from workspace. The legacy
# Tauri/Vue desktop crate still lives at the repo path for forensic /
# rollback purposes (see scripts/legacy/build-tauri.sh) but is no longer
# compiled by `cargo build --workspace` / `cargo test --workspace`.
# Physical deletion of the directory is scheduled for v0.80.0.
members = [
    "crates/termex-core",
    "crates/termex-flutter-bridge",
    "crates/termexd",
]
# Cargo's manifest validation still scans the directory for any `[package]`
# referenced via path = ; explicitly mark src-tauri as excluded so a stray
# `cargo metadata` doesn't try to pick it up.
exclude = ["src-tauri"]

[workspace.dependencies]
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
thiserror    = "2"
uuid         = { version = "1", features = ["v4"] }
anyhow       = "1"
log          = "0.4"
async-trait  = "0.1"
zeroize      = { version = "1", features = ["zeroize_derive"] }
tempfile     = "3"
termex-core  = { path = "crates/termex-core" }
