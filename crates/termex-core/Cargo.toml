[package]
name        = "termex-core"
version = "0.79.0"
edition     = "2021"
license     = "MIT"
description = "Termex core business logic — no Tauri dependency"

[lib]
name = "termex_core"

[features]
default  = []
# v0.71.0+: enables the daemon client SDK (`DaemonClient`) and shared
# wire-protocol DTOs. Pulls in `tokio-tungstenite` for WebSocket and
# `chrono` for RFC3339 timestamps. The termexd binary always enables this.
daemon   = ["dep:tokio-tungstenite"]

[dependencies]
serde.workspace       = true
serde_json.workspace  = true
tokio.workspace       = true
thiserror.workspace   = true
uuid.workspace        = true
anyhow.workspace      = true
log.workspace         = true
async-trait.workspace = true
zeroize.workspace     = true

time         = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
env_logger   = "0.11"
# `bundled-sqlcipher-vendored-openssl` ships an OpenSSL build alongside
# SQLCipher so cross-compiling to Android (and any other target without a
# system libssl) succeeds. Desktop builds get the same vendored OpenSSL —
# slightly larger binary (~3 MB) but no runtime libssl dependency to chase.
rusqlite     = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
ring         = "0.17"
argon2       = "0.5"
russh        = "0.49"
russh-keys   = "0.49"
russh-sftp   = "2.1"
dirs         = "6"
tokio-util   = "0.7"
regex        = "1"
# `default-features = false` strips reqwest's native-tls backend (which pulls
# openssl-sys via libcrypto) — that doesn't cross-compile to Android out of
# the box without vendored openssl. rustls-tls is pure Rust and links the
# same on every target. Desktop builds get identical behaviour (rustls is
# what most Rust HTTP stacks ship with by default now).
reqwest      = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
flate2       = "1"
tar          = "0.4"
futures-util = "0.3"
hex          = "0.4"
keyring      = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio-socks  = "0.5"
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
glob         = "0.3"
whoami       = "1"
base64       = "0.22"
fs2          = "0.4"

chrono            = { version = "0.4", features = ["serde"] }

# Optional deps (gated by `daemon` feature)
tokio-tungstenite = { version = "0.21", optional = true }

[dev-dependencies]
tempfile.workspace = true
