[package]
name        = "termex_flutter_bridge"
version = "0.79.0"
edition     = "2021"
license     = "MIT"
description = "flutter_rust_bridge v2 binding layer for Termex"

[lib]
name       = "termex_flutter_bridge"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Always pull termex-core with the `daemon` feature so the bridge can
# expose api/daemon.rs (v0.71.0+ task daemon SDK).
termex-core           = { path = "../termex-core", features = ["daemon"] }
anyhow.workspace      = true
tokio.workspace       = true
serde.workspace       = true
serde_json.workspace  = true
uuid.workspace        = true
async-trait.workspace = true
flutter_rust_bridge   = "=2.12.0"
dashmap               = "5"
once_cell             = "1"
chrono                = { version = "0.4", features = ["serde"] }
time                  = { version = "0.3", features = ["formatting", "parsing"] }
# See crates/termex-core/Cargo.toml — vendored openssl required for Android.
rusqlite              = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
dirs                  = "6"
open                  = "5"
base64                = "0.22"
ring                  = "0.17"
regex                 = "1"

# portable-pty depends on serial-unix -> ioctl-rs/termios, which do not
# compile for iOS or Android sandboxes (no /dev/ptmx, no termios ioctls,
# spawn() is restricted). The local_pty module is gated to desktop
# targets; mobile targets get a stub that preserves the FRB API surface.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
portable-pty = "0.8"

# Closed-source companion crate lives in a SIBLING repo (`../../../termex-core-private`).
# Only resolved when the `private` feature is activated; OSS clones don't need
# this directory to exist.
termex-core-private   = { path = "../../../termex-core-private", optional = true }

[features]
default  = []
# Enables the closed-source sync/cloud/team/recording/monitor implementations
# carved out of OSS termex-core in Phases 1b–3. Without this feature the
# corresponding FRB API functions return `Err("... requires the commercial build")`.
private  = ["dep:termex-core-private"]

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = "0.21"
futures-util      = "0.3"
