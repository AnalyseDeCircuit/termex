name: Release

# v0.78.0 PC cutover: Tauri release pipeline removed. Desktop binaries
# now come from `flutter_distributor` driven by app/distribute_options.yaml.
# The legacy Tauri build steps live in scripts/legacy/build-tauri.sh for
# emergency forensic / rollback use — they are intentionally NOT wired
# into this workflow.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Create release first so build jobs don't race ────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r -d '' RELEASE_BODY << 'BODY' || true
          See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          ## macOS Users

          The `.dmg` is signed with an Apple Developer ID and notarized by Apple — drag Termex to Applications and double-click to launch. No Gatekeeper workaround required.

          ## v0.78.0+ Note

          Desktop binaries are now built from the Flutter stack only. The legacy Tauri/Vue stack is no longer published; existing users keep their data (shared SQLCipher DB).
          BODY

          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases \
            -f tag_name="${{ github.ref_name }}" \
            -f name="Termex ${{ github.ref_name }}" \
            -f body="$RELEASE_BODY" \
            -F draft=false \
            -F prerelease=false \
            --jq '.id')
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  # ── Flutter desktop builds ────────────────────────────────
  build:
    name: Build (${{ matrix.label }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: mac-aarch64
            os: macos-latest
            distributor-job: macos-dmg-arm64
            artifact-suffix: mac_aarch64

          - label: mac-x86_64
            os: macos-latest
            distributor-job: macos-dmg-x64
            artifact-suffix: mac_x64

          - label: win-x64
            os: windows-latest
            distributor-job: windows-msix
            artifact-suffix: win_x64

          - label: linux-x86_64
            os: ubuntu-22.04
            distributor-job: linux-appimage
            artifact-suffix: linux_x64

          - label: linux-aarch64
            os: ubuntu-24.04-arm
            distributor-job: linux-deb
            artifact-suffix: linux_aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Linux dependencies (GTK / sqlcipher) ──────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libsqlcipher-dev \
            pkg-config \
            ninja-build \
            libsecret-1-dev \
            libayatana-appindicator3-dev \
            rpm

      # ── Windows OpenSSL (required by SQLCipher / rusqlite) ──
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── Flutter toolchain ────────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      # ── Build via flutter_distributor (uses distribute_options.yaml) ──
      - name: Build release artefact
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flutter_distributor release --name stable --jobs ${{ matrix.distributor-job }}

      # ── Upload artefacts to the release ──────────────────
      - name: Upload artefacts (Unix)
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd app/release
          for f in $(find . -type f -name "*.dmg" -o -name "*.msix" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage"); do
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done

      - name: Upload artefacts (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          cd app/release
          Get-ChildItem -Recurse -Include *.msix,*.exe | ForEach-Object {
            gh release upload "${{ github.ref_name }}" "$($_.FullName)" --clobber
          }

  # ── Rename release assets to canonical Termex_<ver>_<plat>_<arch>.<ext> ──
  rename-assets:
    name: Rename Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rename release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          ASSETS=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.assets[] | "\(.id) \(.name)"')

          detect_arch() {
            local name="$1"
            if [[ "$name" == *"aarch64"* ]] || [[ "$name" == *"arm64"* ]]; then
              echo "aarch64"
            else
              echo "x64"
            fi
          }

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ASSET_ID=$(echo "$line" | awk '{print $1}')
            OLD_NAME=$(echo "$line" | awk '{$1=""; print $0}' | xargs)
            NEW_NAME=""
            ARCH=$(detect_arch "$OLD_NAME")

            case "$OLD_NAME" in
              *.dmg)      NEW_NAME="Termex_${VERSION}_mac_${ARCH}.dmg" ;;
              *.msix)     NEW_NAME="Termex_${VERSION}_win_${ARCH}.msix" ;;
              *.deb)      NEW_NAME="Termex_${VERSION}_linux_${ARCH}.deb" ;;
              *.rpm)      NEW_NAME="Termex_${VERSION}_linux_${ARCH}.rpm" ;;
              *.AppImage) NEW_NAME="Termex_${VERSION}_linux_${ARCH}.AppImage" ;;
              *) continue ;;
            esac

            if [ -n "$NEW_NAME" ] && [ "$NEW_NAME" != "$OLD_NAME" ]; then
              echo "Renaming: $OLD_NAME → $NEW_NAME"
              gh api --method PATCH repos/${{ github.repository }}/releases/assets/$ASSET_ID \
                -f name="$NEW_NAME" || true
            fi
          done <<< "$ASSETS"
