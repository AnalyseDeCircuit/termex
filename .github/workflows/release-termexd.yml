name: Release termexd

on:
  push:
    tags:
      - 'termexd-v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            need_musl: true
            cross: false
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            need_musl: true
            cross: true
          - target: aarch64-apple-darwin
            runner: macos-14
            need_musl: false
            cross: false
          - target: x86_64-apple-darwin
            runner: macos-13
            need_musl: false
            cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (linux)
        if: matrix.need_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install aarch64 cross-compiler
        if: matrix.cross
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV

      - name: Build termexd
        run: cargo build -p termexd --release --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/termexd

      - name: Resolve version
        id: version
        run: |
          ver=${GITHUB_REF#refs/tags/termexd-v}
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf "dist/termexd-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz" \
            -C target/${{ matrix.target }}/release termexd
          ( cd dist && shasum -a 256 "termexd-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz" \
            > "termexd-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: termexd-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        run: |
          cd dist
          sha256sum termexd-*.tar.gz > SHA256SUMS

      - name: Resolve version
        id: version
        run: |
          ver=${GITHUB_REF#refs/tags/termexd-v}
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: termexd v${{ steps.version.outputs.version }}
          body: |
            termexd v${{ steps.version.outputs.version }} release binaries.

            Install (any supported Linux / macOS host):

            ```sh
            curl -sSL https://termex.dev/install-termexd.sh | sh
            ```

            Or manually:

            ```sh
            curl -fsSL https://github.com/zouwei/termex/releases/download/${{ github.ref_name }}/termexd-${{ steps.version.outputs.version }}-$(uname -s | tr A-Z a-z)-$(uname -m).tar.gz \
              | tar -xz
            chmod +x termexd && mv termexd ~/.local/bin/
            ```

            Verify with the published `SHA256SUMS`.
          files: |
            dist/termexd-*.tar.gz
            dist/termexd-*.tar.gz.sha256
            dist/SHA256SUMS
            crates/termexd/contrib/install-termexd.sh
